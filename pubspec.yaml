publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.5
  crypto: ^3.0.7
  image_picker: ^1.2.3

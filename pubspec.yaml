  health: ^13.3.2
  pdf: ^3.13.0
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.2
  http: ^1.6.0
  app_links: ^6.4.0
  sentry_flutter: ^9.6.0

dev_dependencies:
